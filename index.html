<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon Drive 3D — Traffic, Harbor Boats & RT Reflections</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <!-- Top Bar -->
    <div class="hud-top">
      <div class="brand-badge">
        <span class="title">HORIZON DRIVE 3D</span>
        <span class="subtitle" id="status-zone">DOWNTOWN WATERFRONT</span>
      </div>

      <div class="toolbar">
        <button id="btn-rt" class="hud-btn active" title="Toggle Real-Time Reflections (T)">
          RT: <span id="rt-label">ON</span>
        </button>
        <button id="btn-floor" class="hud-btn active" title="Cycle Dry / Wet Floor (B)">
          FLOOR: <span id="floor-label">DRY + WET</span>
        </button>
        <button id="btn-traffic" class="hud-btn active" title="Toggle AI Traffic & Boats (P)">
          TRAFFIC: <span id="traffic-label">ON</span>
        </button>
        <button id="btn-weather" class="hud-btn" title="Cycle Weather (V)">
          WEATHER: <span id="weather-label">CLEAR</span>
        </button>
        <button id="btn-time" class="hud-btn" title="Cycle Time of Day (N)">
          TIME: <span id="time-label">SUNSET</span>
        </button>
        <button id="btn-camera" class="hud-btn" title="Switch Camera (C)">
          CAM: <span id="cam-label">CHASE</span>
        </button>
        <button id="btn-sound" class="hud-btn" title="Toggle Audio (M)">
          AUDIO: <span id="sound-label">CLICK / DRIVE</span>
        </button>
        <button id="btn-reset" class="hud-btn accent" title="Reset Car Position (R)">
          RESET
        </button>
      </div>
    </div>

    <!-- Center Event Banner -->
    <div id="event-banner" class="event-banner"></div>

    <!-- Bottom HUD -->
    <div class="hud-bottom">
      <!-- Minimap -->
      <div class="minimap-panel">
        <canvas id="minimap" width="190" height="190"></canvas>
        <div class="minimap-coords" id="coords-display">X: 0 | Z: 20</div>
      </div>

      <!-- Controls Legend -->
      <div class="controls-panel">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Arrows</kbd> Drive &nbsp;|&nbsp; <kbd>Space</kbd> Handbrake &nbsp;|&nbsp; <kbd>Shift</kbd> Nitro &nbsp;|&nbsp; <kbd>H</kbd> Horn</div>
        <div><kbd>B</kbd> Dry/Wet &nbsp;|&nbsp; <kbd>P</kbd> Traffic/Boats &nbsp;|&nbsp; <kbd>T</kbd> RT &nbsp;|&nbsp; <kbd>V</kbd> Weather &nbsp;|&nbsp; <kbd>N</kbd> Time &nbsp;|&nbsp; <kbd>C</kbd> Cam &nbsp;|&nbsp; <kbd>R</kbd> Reset</div>
      </div>

      <!-- Telemetry & Surface Readout -->
      <div class="telemetry-panel">
        <div class="telemetry-top">
          <span class="surface-pill dry" id="surface-pill">DRY ASPHALT</span>
          <span class="grip-readout" id="grip-readout">GRIP 100%</span>
        </div>

        <div class="speed-row">
          <div class="gear-box">
            <span class="label">GEAR</span>
            <span id="gear-value">N</span>
          </div>
          <div class="speed-box">
            <span id="speed-value">0</span>
            <span class="unit">KM/H</span>
          </div>
        </div>

        <div class="bar-group">
          <div class="bar-header">
            <span>RPM</span>
            <span id="rpm-text">850</span>
          </div>
          <div class="bar-track">
            <div id="rpm-fill" class="bar-fill rpm"></div>
          </div>
        </div>

        <div class="bar-group">
          <div class="bar-header">
            <span>NITRO</span>
            <span id="nitro-text">100%</span>
          </div>
          <div class="bar-track">
            <div id="nitro-fill" class="bar-fill nitro"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Three.js r128 UMD + Split Scripts (1/2 world.js, 2/2 game.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="world.js"></script>
  <script src="game.js"></script>
</body>
</html>
